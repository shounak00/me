<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>Demo Reels – Shounak Sobahani</title><meta name="viewport" content="width=device-width,initial-scale=1"/><style>
:root{--bg:#0b0f17;--card:#0f1623;--text:#e7eefc;--muted:#a9b6d3;--line:rgba(255,255,255,.08);--btn:#172238;--btnHover:#1f2d4a;--accent:#7aa7ff;--accent2:#7affce;--gold:#ffd97d;--goldFaint:rgba(255,217,125,.08);--accentFaint:rgba(122,167,255,.08);--accent2Faint:rgba(122,255,206,.07)}
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,"Helvetica Neue",Helvetica,sans-serif;background:radial-gradient(1200px 600px at 20% -10%,rgba(122,167,255,.22),transparent 60%),radial-gradient(1000px 600px at 80% 10%,rgba(122,255,211,.12),transparent 60%),var(--bg);color:var(--text);line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 80px}
.back a{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--muted);border:1px solid var(--line);padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.03);transition:.18s ease;font-size:14px}
.back a:hover{color:var(--text);border-color:rgba(122,167,255,.35)}
.hero{margin:36px 0 32px}
.badge{display:inline-block;margin-bottom:14px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(122,167,255,.28);padding:5px 12px;border-radius:999px;background:rgba(122,167,255,.07)}
.hero h1{margin:0 0 8px;font-size:clamp(26px,3.5vw,42px);letter-spacing:.3px}
.hero p{margin:0;color:var(--muted);font-size:15px;line-height:1.65}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.reel-card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(15,22,35,.72);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.2s ease}
.reel-card:hover{border-color:rgba(122,167,255,.3);transform:translateY(-2px);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.reel-embed{position:relative;width:100%;padding-bottom:56.25%}
.reel-embed iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.reel-info{padding:16px 18px}
.reel-num{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.reel-title{font-size:15px;font-weight:600;margin:0;color:var(--text)}
@media(max-width:680px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="wrap">
  <p class="back"><a href="../../index.html">← Back</a></p>
  <div class="hero">
    <div class="badge">Demo Reels</div>
    <h1>Selected Work</h1>
    <p>Gameplay, simulation, and XR demos from shipped projects.</p>
  </div>
  <div class="grid">
    <div class="reel-card">
      <div class="reel-embed"><iframe src="https://www.youtube.com/embed/IxZTBGQoEhs" title="Demo Reel 1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      <div class="reel-info"><p class="reel-num">Demo 01</p><p class="reel-title">Selected Reel</p></div>
    </div>
    <div class="reel-card">
      <div class="reel-embed"><iframe src="https://www.youtube.com/embed/Tq9AtJgOwlM" title="Demo Reel 2" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      <div class="reel-info"><p class="reel-num">Demo 02</p><p class="reel-title">Selected Reel</p></div>
    </div>
    <div class="reel-card">
      <div class="reel-embed"><iframe src="https://www.youtube.com/embed/fAvV0GeRvw0" title="Demo Reel 3" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      <div class="reel-info"><p class="reel-num">Demo 03</p><p class="reel-title">Selected Reel</p></div>
    </div>
    <div class="reel-card">
      <div class="reel-embed"><iframe src="https://www.youtube.com/embed/ivn6VW8vtY8" title="Demo Reel 4" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      <div class="reel-info"><p class="reel-num">Demo 04</p><p class="reel-title">Selected Reel</p></div>
    </div>
  </div>
</div>
</body></html>
