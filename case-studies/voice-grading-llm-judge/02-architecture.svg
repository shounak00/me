   <g id="text_1">
    <text style="font-weight: 600; font-size: 13px; font-family: 'Segoe UI'; text-anchor: start; fill: #1f2328" x="12.78" y="18.288" transform="rotate(-0 12.78 18.288)">Runtime pipeline (everything on one local PC, no cloud)</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 600; font-size: 11px; font-family: 'Segoe UI'; text-anchor: middle; fill: #1f2328" x="60.21" y="92.834079" transform="rotate(-0 60.21 92.834079)">Microphone</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'Segoe UI'; text-anchor: middle; fill: #6b7280" x="60.21" y="115.259228" transform="rotate(-0 60.21 115.259228)">trainee speaks</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 600; font-size: 11px; font-family: 'Segoe UI'; text-anchor: middle; fill: #1f2328" x="185.76" y="93.002624" transform="rotate(-0 185.76 93.002624)">VAD + noise filter</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'Segoe UI'; fill: #6b7280" transform="translate(150.766562 110.637685)">high-pass, spectral</text>
    <text style="font-size: 8.5px; font-family: 'Segoe UI'; fill: #6b7280" transform="translate(139.701953 120.046953)">subtraction, 16 kHz WAV</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 600; font-size: 11px; font-family: 'Segoe UI'; text-anchor: middle; fill: #1f2328" x="322.47" y="92.80486" transform="rotate(-0 322.47 92.80486)">Whisper large-v3</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.5px; font-family: 'Segoe UI'; fill: #6b7280" transform="translate(288.136641 110.660263)">local server, CUDA</text>
    <text style="font-size: 8.5px; font-family: 'Segoe UI'; fill: #6b7280" transform="translate(279.48457 119.858193)">prompted with the line</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 600; font-size: 11px; font-family: 'Segoe UI'; text-anchor: middle; fill: #1f2328" x="464.76" y="92.80486" transform="rotate(-0 464.76 92.80486)">LLM judge</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.5px; font-family: 'Segoe UI'; fill: #6b7280" transform="translate(425.666641 110.544384)">Qwen3 4B, in-engine</text>
    <text style="font-size: 8.5px; font-family: 'Segoe UI'; fill: #6b7280" transform="translate(420.969727 119.849228)">JSON grammar, temp 0</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 600; font-size: 11px; font-family: 'Segoe UI'; text-anchor: middle; fill: #1f2328" x="609.84" y="92.941608" transform="rotate(-0 609.84 92.941608)">Score + band</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.5px; font-family: 'Segoe UI'; fill: #6b7280" transform="translate(588.846992 110.502382)">pass &gt;= 70</text>
    <text style="font-size: 8.5px; font-family: 'Segoe UI'; fill: #6b7280" transform="translate(567.603633 119.866494)">reason, missing details</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 600; font-size: 10.5px; font-family: 'Segoe UI'; text-anchor: middle; fill: #1f2328" x="464.76" y="206.99589" transform="rotate(-0 464.76 206.99589)">Keyword gate</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8px; font-family: 'Segoe UI'; fill: #6b7280" transform="translate(433.73875 223.204459)">optional per step:</text>
    <text style="font-size: 8px; font-family: 'Segoe UI'; fill: #6b7280" transform="translate(428.551875 232.102741)">caps score if missing</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 600; font-size: 10.5px; font-family: 'Segoe UI'; text-anchor: middle; fill: #1f2328" x="609.84" y="207.126422" transform="rotate(-0 609.84 207.126422)">Fallback</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8px; font-family: 'Segoe UI'; fill: #6b7280" transform="translate(580.92875 223.282663)">NLP scorer, then</text>
    <text style="font-size: 8px; font-family: 'Segoe UI'; fill: #6b7280" transform="translate(577.539375 232.024538)">keywords (if &gt; 3 s)</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 600; font-size: 10.5px; font-family: 'Segoe UI'; text-anchor: middle; fill: #1f2328" x="322.47" y="207.082023" transform="rotate(-0 322.47 207.082023)">Attempt buffer</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8px; font-family: 'Segoe UI'; fill: #6b7280" transform="translate(283.1575 223.289459)">transcripts of the step:</text>
    <text style="font-size: 8px; font-family: 'Segoe UI'; fill: #6b7280" transform="translate(272.974375 232.102741)">up to 3, joined, 15 s window</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9.5px; font-family: 'Segoe UI'; text-anchor: start; fill: #6b7280" x="12.78" y="270.54" transform="rotate(-0 12.78 270.54)">Latency budget per line: ~0.8 s end-of-speech wait + ~1 s Whisper + 0.6 s (idle GPU) to ~1.8 s (game rendering) LLM.</text>
   </g>
  </g>
