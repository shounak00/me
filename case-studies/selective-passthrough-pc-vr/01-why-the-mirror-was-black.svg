<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 516" width="1080" height="516" role="img" aria-label="Why the desktop mirror showed black hands">
<title>Why the desktop mirror showed black hands</title><defs><style>
  .bg{fill:#0E1116} .panel{fill:#161B22;stroke:#30363D;stroke-width:1}
  .t{fill:#E6EDF3;font-family:'Segoe UI',Inter,system-ui,sans-serif}
  .m{fill:#8B949E;font-family:'Segoe UI',Inter,system-ui,sans-serif}
  .h{font-size:19px;font-weight:650} .s{font-size:13.5px} .xs{font-size:11.5px}
  .lbl{font-size:12.5px;font-weight:600}
  .mono{font-family:'Cascadia Code',Consolas,ui-monospace,monospace;font-size:11.5px}
  .ar{stroke:#8B949E;stroke-width:1.6;fill:none;marker-end:url(#a)}
  .arA{stroke:#58A6FF;stroke-width:2;fill:none;marker-end:url(#aA)}
  .arR{stroke:#A371F7;stroke-width:2;fill:none;marker-end:url(#aR)}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8B949E"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#58A6FF"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A371F7"/></marker>
</defs><rect class="bg" width="1080" height="516"/><text x="40" y="52" class="t h" text-anchor="start">Why the desktop mirror showed black hands</text><text x="40" y="76" class="m s" text-anchor="start">The passthrough the wearer sees is composited by the runtime after the application has finished drawing.</text><rect x="40" y="108" width="480" height="300" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="60" y="136" class="t lbl" text-anchor="start">WHAT THE WEARER SEES</text><rect x="64" y="156" width="432" height="110" rx="8" fill="#0B0E13" stroke="#30363D" stroke-width="1"/><text x="78" y="178" class="m xs" text-anchor="start">1 · Application colour buffer</text><g transform="translate(170,232) scale(0.72)" opacity="1.0"><path d="M0,46 C-16,46 -22,34 -22,20 L-22,-6 C-22,-12 -13,-12 -13,-6 L-13,8 L-13,-26 C-13,-33 -4,-33 -4,-26 L-4,6 L-4,-34 C-4,-41 5,-41 5,-34 L5,6 L5,-28 C5,-35 14,-35 14,-28 L14,10 L14,-8 C14,-14 22,-14 22,-8 L22,22 C22,36 16,46 2,46 Z" fill="#0B0E13" stroke="#F85149" stroke-width="1.5"/></g><text x="240" y="215" class="m xs" text-anchor="start">hand region written</text><text x="240" y="232" class="t mono" text-anchor="start">RGBA = 0</text><text x="240" y="252" class="m xs" text-anchor="start">the zero alpha IS the mechanism</text><path class="arR" d="M280,272 L280,296"/><rect x="64" y="300" width="432" height="88" rx="8" fill="#0B0E13" stroke="#A371F7" stroke-width="1"/><text x="78" y="322" class="m xs" text-anchor="start">2 · Runtime compositor adds passthrough underlay</text><g transform="translate(170,358) scale(0.52)" opacity="1.0"><path d="M0,46 C-16,46 -22,34 -22,20 L-22,-6 C-22,-12 -13,-12 -13,-6 L-13,8 L-13,-26 C-13,-33 -4,-33 -4,-26 L-4,6 L-4,-34 C-4,-41 5,-41 5,-34 L5,6 L5,-28 C5,-35 14,-35 14,-28 L14,10 L14,-8 C14,-14 22,-14 22,-8 L22,22 C22,36 16,46 2,46 Z" fill="#6E5B3E"/></g><text x="240" y="352" class="t s" text-anchor="start">real hands appear</text><text x="240" y="370" class="m xs" text-anchor="start">full depth-reconstructed quality</text><circle cx="470" cy="344" r="15" fill="#3FB950" opacity="0.18"/><text x="470" y="349" class="t lbl" text-anchor="middle">✓</text><rect x="560" y="108" width="480" height="300" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="580" y="136" class="t lbl" text-anchor="start">WHAT THE MONITOR SHOWS</text><rect x="584" y="156" width="432" height="110" rx="8" fill="#0B0E13" stroke="#30363D" stroke-width="1"/><text x="598" y="178" class="m xs" text-anchor="start">1 · Application colour buffer</text><g transform="translate(690,232) scale(0.72)" opacity="1.0"><path d="M0,46 C-16,46 -22,34 -22,20 L-22,-6 C-22,-12 -13,-12 -13,-6 L-13,8 L-13,-26 C-13,-33 -4,-33 -4,-26 L-4,6 L-4,-34 C-4,-41 5,-41 5,-34 L5,6 L5,-28 C5,-35 14,-35 14,-28 L14,10 L14,-8 C14,-14 22,-14 22,-8 L22,22 C22,36 16,46 2,46 Z" fill="#0B0E13" stroke="#F85149" stroke-width="1.5"/></g><text x="760" y="215" class="m xs" text-anchor="start">same buffer,</text><text x="760" y="232" class="t mono" text-anchor="start">same RGBA = 0</text><path class="ar" d="M800,272 L800,296" stroke-dasharray="4 4"/><rect x="584" y="300" width="432" height="88" rx="8" fill="#0B0E13" stroke="#F85149" stroke-width="1" stroke-dasharray="5 4"/><text x="598" y="322" class="m xs" text-anchor="start">2 · compositor never runs for this surface</text><g transform="translate(690,358) scale(0.52)" opacity="1.0"><path d="M0,46 C-16,46 -22,34 -22,20 L-22,-6 C-22,-12 -13,-12 -13,-6 L-13,8 L-13,-26 C-13,-33 -4,-33 -4,-26 L-4,6 L-4,-34 C-4,-41 5,-41 5,-34 L5,6 L5,-28 C5,-35 14,-35 14,-28 L14,10 L14,-8 C14,-14 22,-14 22,-8 L22,22 C22,36 16,46 2,46 Z" fill="#000000" stroke="#F85149" stroke-width="1.5"/></g><text x="760" y="352" class="t s" text-anchor="start">solid black</text><text x="760" y="370" class="m xs" text-anchor="start">no setting changes this</text><circle cx="990" cy="344" r="15" fill="#F85149" opacity="0.18"/><text x="990" y="350" class="t lbl" text-anchor="middle">✕</text><rect x="40" y="428" width="1000" height="56" rx="8" fill="#0B0E13" stroke="#58A6FF" stroke-width="1"/><text x="60" y="462" class="t s" text-anchor="start">The mirror displays the application's own colour buffer — so the only fix is for the application to own the pixels.</text></svg>