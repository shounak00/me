<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 584" width="1080" height="584" role="img" aria-label="Recovering an undocumented interface">
<title>Recovering an undocumented interface</title><defs><style>
  .bg{fill:#0E1116} .panel{fill:#161B22;stroke:#30363D;stroke-width:1}
  .t{fill:#E6EDF3;font-family:'Segoe UI',Inter,system-ui,sans-serif}
  .m{fill:#8B949E;font-family:'Segoe UI',Inter,system-ui,sans-serif}
  .h{font-size:19px;font-weight:650} .s{font-size:13.5px} .xs{font-size:11.5px}
  .lbl{font-size:12.5px;font-weight:600}
  .mono{font-family:'Cascadia Code',Consolas,ui-monospace,monospace;font-size:11.5px}
  .ar{stroke:#8B949E;stroke-width:1.6;fill:none;marker-end:url(#a)}
  .arA{stroke:#58A6FF;stroke-width:2;fill:none;marker-end:url(#aA)}
  .arR{stroke:#A371F7;stroke-width:2;fill:none;marker-end:url(#aR)}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8B949E"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#58A6FF"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A371F7"/></marker>
</defs><rect class="bg" width="1080" height="584"/><text x="40" y="52" class="t h" text-anchor="start">Recovering an undocumented interface</text><text x="40" y="76" class="m s" text-anchor="start">No public header: no struct layouts, no constants, no signatures. Four techniques, cross-checked against each other.</text><rect x="40" y="108" width="1000" height="76" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/><circle cx="78" cy="146" r="19" fill="#58A6FF" opacity="0.15"/><text x="78" y="151" class="t lbl" text-anchor="middle">01</text><text x="114" y="140" class="t lbl" text-anchor="start">String extraction</text><text x="114" y="162" class="m xs" text-anchor="start">The runtime's own diagnostic format string</text><text x="1020" y="140" class="m xs" text-anchor="end">A vendor log line is a field-by-field map of the str</text><text x="1020" y="160" class="m xs" text-anchor="end">uct it prints.</text><rect x="40" y="200" width="1000" height="76" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/><circle cx="78" cy="238" r="19" fill="#58A6FF" opacity="0.15"/><text x="78" y="243" class="t lbl" text-anchor="middle">02</text><text x="114" y="232" class="t lbl" text-anchor="start">Constant scanning</text><text x="114" y="254" class="m xs" text-anchor="start">Pins the extension identity</text><text x="1020" y="232" class="m xs" text-anchor="end">Validated FIRST against a documented extension's plu</text><text x="1020" y="252" class="m xs" text-anchor="end">g-in.</text><rect x="40" y="292" width="1000" height="76" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/><circle cx="78" cy="330" r="19" fill="#58A6FF" opacity="0.15"/><text x="78" y="335" class="t lbl" text-anchor="middle">03</text><text x="114" y="324" class="t lbl" text-anchor="start">Disassembly</text><text x="114" y="346" class="m xs" text-anchor="start">Entry points, arguments, field offsets</text><text x="1020" y="324" class="m xs" text-anchor="end">Variadic calling convention maps each format specifi</text><text x="1020" y="344" class="m xs" text-anchor="end">er to a field.</text><rect x="40" y="384" width="1000" height="76" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/><circle cx="78" cy="422" r="19" fill="#58A6FF" opacity="0.15"/><text x="78" y="427" class="t lbl" text-anchor="middle">04</text><text x="114" y="416" class="t lbl" text-anchor="start">Absence check</text><text x="114" y="438" class="m xs" text-anchor="start">Proves what is NOT validated</text><text x="1020" y="416" class="m xs" text-anchor="end">Removed an entire class of risk before a single call</text><text x="1020" y="436" class="m xs" text-anchor="end"> was made.</text><rect x="40" y="484" width="1000" height="68" rx="8" fill="#0B0E13" stroke="#D29922" stroke-width="1"/><text x="62" y="514" class="t s" text-anchor="start">A technique that cannot reproduce a known answer should not be trusted with an unknown one.</text><text x="62" y="536" class="m xs" text-anchor="start">The constant scan was required to reproduce a public extension's published constants before being pointed at the undocumented one.</text></svg>