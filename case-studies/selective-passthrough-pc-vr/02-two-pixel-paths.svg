<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 566" width="1080" height="566" role="img" aria-label="Two independent pixel paths">
<title>Two independent pixel paths</title><defs><style>
  .bg{fill:#0E1116} .panel{fill:#161B22;stroke:#30363D;stroke-width:1}
  .t{fill:#E6EDF3;font-family:'Segoe UI',Inter,system-ui,sans-serif}
  .m{fill:#8B949E;font-family:'Segoe UI',Inter,system-ui,sans-serif}
  .h{font-size:19px;font-weight:650} .s{font-size:13.5px} .xs{font-size:11.5px}
  .lbl{font-size:12.5px;font-weight:600}
  .mono{font-family:'Cascadia Code',Consolas,ui-monospace,monospace;font-size:11.5px}
  .ar{stroke:#8B949E;stroke-width:1.6;fill:none;marker-end:url(#a)}
  .arA{stroke:#58A6FF;stroke-width:2;fill:none;marker-end:url(#aA)}
  .arR{stroke:#A371F7;stroke-width:2;fill:none;marker-end:url(#aR)}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8B949E"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#58A6FF"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A371F7"/></marker>
</defs><rect class="bg" width="1080" height="566"/><text x="40" y="52" class="t h" text-anchor="start">Two independent pixel paths, shipped together</text><text x="40" y="76" class="m s" text-anchor="start">Alpha stays at zero, so the headset keeps the runtime's full-quality passthrough while the monitor gains real pixels.</text><rect x="40" y="108" width="1000" height="150" rx="8" fill="#161B22" stroke="#A371F7" stroke-width="1"/><text x="62" y="136" class="t lbl" text-anchor="start">PATH A · compositor underlay  →  headset</text><rect x="70" y="156" width="180" height="56" rx="8" fill="#0B0E13" stroke="#A371F7" stroke-width="1"/><text x="160" y="180" class="t s" text-anchor="middle">public</text><text x="160" y="198" class="m xs" text-anchor="middle">passthrough</text><path class="arR" d="M252,184 L276,184"/><rect x="280" y="156" width="180" height="56" rx="8" fill="#0B0E13" stroke="#A371F7" stroke-width="1"/><text x="370" y="180" class="t s" text-anchor="middle">composition</text><text x="370" y="198" class="m xs" text-anchor="middle">layer</text><path class="arR" d="M462,184 L486,184"/><rect x="490" y="156" width="180" height="56" rx="8" fill="#0B0E13" stroke="#A371F7" stroke-width="1"/><text x="580" y="180" class="t s" text-anchor="middle">runtime</text><text x="580" y="198" class="m xs" text-anchor="middle">composites</text><path class="arR" d="M672,184 L696,184"/><rect x="700" y="156" width="180" height="56" rx="8" fill="#0B0E13" stroke="#A371F7" stroke-width="1"/><text x="790" y="180" class="t s" text-anchor="middle">wearer</text><text x="790" y="198" class="m xs" text-anchor="middle">sees</text><circle cx="930" cy="184" r="16" fill="#3FB950" opacity="0.18"/><text x="930" y="190" class="t lbl" text-anchor="middle">✓</text><rect x="40" y="278" width="1000" height="150" rx="8" fill="#161B22" stroke="#58A6FF" stroke-width="1"/><text x="62" y="306" class="t lbl" text-anchor="start">PATH B · application-owned camera feed  →  monitor</text><rect x="70" y="326" width="180" height="56" rx="8" fill="#0B0E13" stroke="#58A6FF" stroke-width="1"/><text x="160" y="350" class="t s" text-anchor="middle">undocumented</text><text x="160" y="368" class="m xs" text-anchor="middle">extension</text><path class="arA" d="M252,354 L276,354"/><rect x="280" y="326" width="180" height="56" rx="8" fill="#0B0E13" stroke="#58A6FF" stroke-width="1"/><text x="370" y="350" class="t s" text-anchor="middle">frame</text><text x="370" y="368" class="m xs" text-anchor="middle">acquired</text><path class="arA" d="M462,354 L486,354"/><rect x="490" y="326" width="180" height="56" rx="8" fill="#0B0E13" stroke="#58A6FF" stroke-width="1"/><text x="580" y="350" class="t s" text-anchor="middle">uploaded</text><text x="580" y="368" class="m xs" text-anchor="middle">texture</text><path class="arA" d="M672,354 L696,354"/><rect x="700" y="326" width="180" height="56" rx="8" fill="#0B0E13" stroke="#58A6FF" stroke-width="1"/><text x="790" y="350" class="t s" text-anchor="middle">projected</text><text x="790" y="368" class="m xs" text-anchor="middle">onto hands</text><circle cx="930" cy="354" r="16" fill="#3FB950" opacity="0.18"/><text x="930" y="360" class="t lbl" text-anchor="middle">✓</text><rect x="40" y="448" width="1000" height="86" rx="8" fill="#0B0E13" stroke="#3FB950" stroke-width="1"/><text x="62" y="478" class="t mono" text-anchor="start">Hand shader writes  RGB = camera feed,  ALPHA = 0</text><text x="62" y="502" class="m xs" text-anchor="start">Zero alpha keeps Path A intact for the wearer · with no feed the shader falls back to RGBA = 0, so on-device builds are unchanged.</text></svg>