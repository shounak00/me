<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="1080" height="400" role="img" aria-label="Camera pipeline and its two hazards">
<title>Camera pipeline and its two hazards</title><defs><style>
  .bg{fill:#0E1116} .panel{fill:#161B22;stroke:#30363D;stroke-width:1}
  .t{fill:#E6EDF3;font-family:'Segoe UI',Inter,system-ui,sans-serif}
  .m{fill:#8B949E;font-family:'Segoe UI',Inter,system-ui,sans-serif}
  .h{font-size:19px;font-weight:650} .s{font-size:13.5px} .xs{font-size:11.5px}
  .lbl{font-size:12.5px;font-weight:600}
  .mono{font-family:'Cascadia Code',Consolas,ui-monospace,monospace;font-size:11.5px}
  .ar{stroke:#8B949E;stroke-width:1.6;fill:none;marker-end:url(#a)}
  .arA{stroke:#58A6FF;stroke-width:2;fill:none;marker-end:url(#aA)}
  .arR{stroke:#A371F7;stroke-width:2;fill:none;marker-end:url(#aR)}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8B949E"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#58A6FF"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A371F7"/></marker>
</defs><rect class="bg" width="1080" height="400"/><text x="40" y="52" class="t h" text-anchor="start">Camera feed to textured hands — and the two hazards on the way</text><text x="40" y="76" class="m s" text-anchor="start">Each stage was verified from the runtime binary before it was called.</text><rect x="40" y="118" width="128" height="62" rx="8" fill="#0B0E13" stroke="#58A6FF" stroke-width="1"/><text x="104" y="146" class="t s" text-anchor="middle">enumerate</text><path class="arA" d="M170,149 L192,149"/><rect x="186" y="118" width="128" height="62" rx="8" fill="#0B0E13" stroke="#58A6FF" stroke-width="1"/><text x="250" y="146" class="t s" text-anchor="middle">create</text><text x="250" y="164" class="m xs" text-anchor="middle">provider</text><path class="arA" d="M316,149 L338,149"/><rect x="332" y="118" width="128" height="62" rx="8" fill="#0B0E13" stroke="#58A6FF" stroke-width="1"/><text x="396" y="146" class="t s" text-anchor="middle">start</text><path class="arA" d="M462,149 L484,149"/><rect x="478" y="118" width="128" height="62" rx="8" fill="#0B0E13" stroke="#58A6FF" stroke-width="1"/><text x="542" y="146" class="t s" text-anchor="middle">acquire</text><path class="arA" d="M608,149 L630,149"/><rect x="624" y="118" width="128" height="62" rx="8" fill="#0B0E13" stroke="#58A6FF" stroke-width="1"/><text x="688" y="146" class="t s" text-anchor="middle">read</text><text x="688" y="164" class="m xs" text-anchor="middle">frame</text><path class="arA" d="M754,149 L776,149"/><rect x="770" y="118" width="128" height="62" rx="8" fill="#0B0E13" stroke="#58A6FF" stroke-width="1"/><text x="834" y="146" class="t s" text-anchor="middle">release</text><path class="arA" d="M900,149 L922,149"/><rect x="916" y="118" width="128" height="62" rx="8" fill="#0B0E13" stroke="#58A6FF" stroke-width="1"/><text x="980" y="146" class="t s" text-anchor="middle">upload</text><text x="980" y="164" class="m xs" text-anchor="middle">texture</text><rect x="40" y="218" width="500" height="150" rx="8" fill="#161B22" stroke="#F85149" stroke-width="1"/><circle cx="74" cy="250" r="13" fill="#F85149" opacity="0.2"/><text x="74" y="255" class="t lbl" text-anchor="middle">!</text><text x="98" y="255" class="t lbl" text-anchor="start">HAZARD · uncatchable process kill</text><text x="62" y="284" class="m xs" text-anchor="start">One enumeration entry point counts over one internal</text><text x="62" y="302" class="m xs" text-anchor="start">collection while indexing a shorter one, then throws a</text><text x="62" y="320" class="m xs" text-anchor="start">native C++ bounds exception. Unwinding across the</text><text x="62" y="338" class="m xs" text-anchor="start">managed boundary terminates the process.</text><text x="62" y="358" class="t xs" text-anchor="start">Never enumerate it — probe via the creation call instead.</text><rect x="560" y="218" width="480" height="150" rx="8" fill="#161B22" stroke="#D29922" stroke-width="1"/><circle cx="594" cy="250" r="13" fill="#D29922" opacity="0.2"/><text x="594" y="255" class="t lbl" text-anchor="middle">!</text><text x="618" y="255" class="t lbl" text-anchor="start">HAZARD · leak that bricks the next run</text><text x="582" y="284" class="m xs" text-anchor="start">Any run exiting without clean teardown leaves a provider</text><text x="582" y="302" class="m xs" text-anchor="start">held by the host service. They accumulate; after a few,</text><text x="582" y="320" class="m xs" text-anchor="start">startup fails for every camera and every resolution and</text><text x="582" y="338" class="m xs" text-anchor="start">no in-process retry recovers it.</text><text x="582" y="358" class="t xs" text-anchor="start">Tear down while the session is still alive.</text></svg>