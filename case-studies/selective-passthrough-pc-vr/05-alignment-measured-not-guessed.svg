<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="1080" height="480" role="img" aria-label="Alignment measured, not guessed">
<title>Alignment measured, not guessed</title><defs><style>
  .bg{fill:#0E1116} .panel{fill:#161B22;stroke:#30363D;stroke-width:1}
  .t{fill:#E6EDF3;font-family:'Segoe UI',Inter,system-ui,sans-serif}
  .m{fill:#8B949E;font-family:'Segoe UI',Inter,system-ui,sans-serif}
  .h{font-size:19px;font-weight:650} .s{font-size:13.5px} .xs{font-size:11.5px}
  .lbl{font-size:12.5px;font-weight:600}
  .mono{font-family:'Cascadia Code',Consolas,ui-monospace,monospace;font-size:11.5px}
  .ar{stroke:#8B949E;stroke-width:1.6;fill:none;marker-end:url(#a)}
  .arA{stroke:#58A6FF;stroke-width:2;fill:none;marker-end:url(#aA)}
  .arR{stroke:#A371F7;stroke-width:2;fill:none;marker-end:url(#aR)}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8B949E"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#58A6FF"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A371F7"/></marker>
</defs><rect class="bg" width="1080" height="480"/><text x="40" y="52" class="t h" text-anchor="start">Alignment: measured, not guessed</text><text x="40" y="76" class="m s" text-anchor="start">Four causes produce visually identical misalignment. Tuning by eye cannot separate them — measurement can.</text><rect x="40" y="108" width="620" height="54" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/><rect x="40" y="108" width="4" height="54" rx="2" fill="#3FB950"/><text x="66" y="131" class="t s" text-anchor="start">constant image-space offset</text><text x="66" y="150" class="m xs" text-anchor="start">wrong principal point</text><rect x="40" y="176" width="620" height="54" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/><rect x="40" y="176" width="4" height="54" rx="2" fill="#3FB950"/><text x="66" y="199" class="t s" text-anchor="start">mesh covers too much / little</text><text x="66" y="218" class="m xs" text-anchor="start">wrong focal length</text><rect x="40" y="244" width="620" height="54" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/><rect x="40" y="244" width="4" height="54" rx="2" fill="#D29922"/><text x="66" y="267" class="t s" text-anchor="start">drifts in motion, settles when still</text><text x="66" y="286" class="m xs" text-anchor="start">link latency — irreducible</text><rect x="40" y="312" width="620" height="54" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/><rect x="40" y="312" width="4" height="54" rx="2" fill="#D29922"/><text x="66" y="335" class="t s" text-anchor="start">edges sample background</text><text x="66" y="354" class="m xs" text-anchor="start">mesh is a proxy — irreducible</text><rect x="690" y="108" width="350" height="258" rx="8" fill="#0B0E13" stroke="#58A6FF" stroke-width="1"/><text x="712" y="136" class="t lbl" text-anchor="start">THE INSTRUMENT</text><text x="712" y="164" class="m xs" text-anchor="start">Project each hand's bounds back into</text><text x="712" y="182" class="m xs" text-anchor="start">the camera image and log the result —</text><text x="712" y="200" class="m xs" text-anchor="start">with the same maths mirrored in app</text><text x="712" y="218" class="m xs" text-anchor="start">code, so the markers cannot disagree</text><text x="712" y="236" class="m xs" text-anchor="start">with what the shader samples.</text><rect x="712" y="254" width="306" height="92" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="730" y="280" class="m xs" text-anchor="start">measured:</text><text x="730" y="302" class="t mono" text-anchor="start">optical axis  5.7°  off head-forward</text><text x="730" y="324" class="t mono" text-anchor="start">mid-view hand  37°  below that axis</text><text x="712" y="362" class="t xs" text-anchor="start">→ the extrinsic orientation is reversed</text><rect x="40" y="388" width="1000" height="60" rx="8" fill="#0B0E13" stroke="#3FB950" stroke-width="1"/><text x="62" y="420" class="t s" text-anchor="start">Outcome: a single interpretation change. No focal or principal-point correction required.</text></svg>