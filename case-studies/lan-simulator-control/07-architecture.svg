<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#0d1117" opacity="1"/><text x="56" y="74" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="26" fill="#e6edf3" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">System architecture</text><text x="56" y="106" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Three transports that fail independently. Control never drops; media drops freely; discovery is best effort.</text><line x1="56" y1="134" x2="1544" y2="134" stroke="#222b36" stroke-width="1" opacity="1"/><rect x="56" y="176" width="660" height="660" rx="12" fill="#11161d" opacity="1" stroke="#2d3845" stroke-width="1"/><text x="80" y="212" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#388bfd" font-weight="700" text-anchor="start" opacity="1" letter-spacing="1.4">INSTRUCTOR WORKSTATION</text><text x="692" y="212" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#525c6b" font-weight="400" text-anchor="end" opacity="1" letter-spacing="0">one per session</text><rect x="80" y="236" width="612" height="104" rx="8" fill="#0b0f15" opacity="1" stroke="#39c5cf" stroke-width="1.5"/><rect x="80" y="236" width="612" height="104" rx="8" fill="#39c5cf" opacity="0.07"/><text x="98" y="266" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#e6edf3" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Instructor simulation (Unity)</text><text x="98" y="288" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Scenario console. Originates every command.</text><text x="98" y="307" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Consumes the shared protocol assembly.</text><rect x="80" y="366" width="612" height="128" rx="8" fill="#0b0f15" opacity="1" stroke="#388bfd" stroke-width="1.5"/><rect x="80" y="366" width="612" height="128" rx="8" fill="#388bfd" opacity="0.07"/><text x="98" y="396" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#e6edf3" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Message server (bundled Node sidecar)</text><text x="98" y="418" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Routes by room. Enforces the role from the signed token.</text><text x="98" y="437" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Stamps the sender. Allow-lists every message type.</text><text x="98" y="456" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Supervised in a Job Object · keys on stdin, never on disk.</text><rect x="80" y="520" width="612" height="128" rx="8" fill="#0b0f15" opacity="1" stroke="#a371f7" stroke-width="1.5"/><rect x="80" y="520" width="612" height="128" rx="8" fill="#a371f7" opacity="0.07"/><text x="98" y="550" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#e6edf3" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Instructor desktop application (.NET 8, WPF)</text><text x="98" y="572" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Supervises the server. Roster, pairing, packet monitor.</text><text x="98" y="591" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Screen wall. Media sink. Connection doctor.</text><text x="98" y="610" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">SQLite packet log · file logging only, no network sinks.</text><rect x="80" y="674" width="612" height="104" rx="8" fill="#0b0f15" opacity="1" stroke="#d29922" stroke-width="1.5"/><rect x="80" y="674" width="612" height="104" rx="8" fill="#d29922" opacity="0.07"/><text x="98" y="704" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#e6edf3" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Discovery responder</text><text x="98" y="726" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Administratively scoped multicast, TTL 1.</text><text x="98" y="745" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">No manual address entry anywhere in the product.</text><rect x="884" y="176" width="660" height="660" rx="12" fill="#11161d" opacity="1" stroke="#2d3845" stroke-width="1"/><text x="908" y="212" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#3fb950" font-weight="700" text-anchor="start" opacity="1" letter-spacing="1.4">TRAINEE WORKSTATION</text><text x="1520" y="212" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#525c6b" font-weight="400" text-anchor="end" opacity="1" letter-spacing="0">× 30</text><rect x="908" y="236" width="612" height="104" rx="8" fill="#0b0f15" opacity="1" stroke="#39c5cf" stroke-width="1.5"/><rect x="908" y="236" width="612" height="104" rx="8" fill="#39c5cf" opacity="0.07"/><text x="926" y="266" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#e6edf3" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Trainee simulation (Unity)</text><text x="926" y="288" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Receives commands directly. Answers with its own result.</text><text x="926" y="307" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Socket callbacks marshalled to the main thread.</text><rect x="908" y="366" width="612" height="128" rx="8" fill="#0b0f15" opacity="1" stroke="#a371f7" stroke-width="1.5"/><rect x="908" y="366" width="612" height="128" rx="8" fill="#a371f7" opacity="0.07"/><text x="926" y="396" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#e6edf3" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Trainee agent (.NET 8 tray application)</text><text x="926" y="418" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Outbound connections only — never an inbound rule.</text><text x="926" y="437" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Pairing, rejoin, own-traffic log.</text><text x="926" y="456" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Loopback bridge to the simulation for capture hints.</text><rect x="908" y="520" width="612" height="128" rx="8" fill="#0b0f15" opacity="1" stroke="#3fb950" stroke-width="1.5"/><rect x="908" y="520" width="612" height="128" rx="8" fill="#3fb950" opacity="0.07"/><text x="926" y="550" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#e6edf3" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Capture and encode</text><text x="926" y="572" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Windows Graphics Capture, GPU-side.</text><text x="926" y="591" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Single-slot buffer: newest frame wins, older is dropped.</text><text x="926" y="610" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">Degrades its own frame rate before the simulation&#x27;s.</text><rect x="908" y="674" width="612" height="104" rx="8" fill="#0b0f15" opacity="1" stroke="#d29922" stroke-width="1.5"/><rect x="908" y="674" width="612" height="104" rx="8" fill="#d29922" opacity="0.07"/><text x="926" y="704" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#e6edf3" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">Shared protocol assembly</text><text x="926" y="726" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">netstandard2.1 · zero dependencies · defined once.</text><text x="926" y="745" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">The same binary on both sides and inside Unity.</text><line x1="716" y1="430" x2="884" y2="430" stroke="#388bfd" stroke-width="2.4" opacity="0.9"/><path d="M872 424 L884 430 L872 436 Z" fill="#388bfd"/><path d="M728 424 L716 430 L728 436 Z" fill="#388bfd"/><rect x="722.0" y="386" width="156" height="34" rx="6" fill="#0d1117" opacity="1"/><text x="800.0" y="408" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12.5" fill="#388bfd" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">CONTROL</text><text x="800.0" y="456" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11" fill="#7d8590" font-weight="400" text-anchor="middle" opacity="1" letter-spacing="0">WebSocket over TLS · never drops</text><line x1="716" y1="584" x2="884" y2="584" stroke="#3fb950" stroke-width="2.4" opacity="0.9" stroke-dasharray="8 6"/><path d="M872 578 L884 584 L872 590 Z" fill="#3fb950"/><path d="M728 578 L716 584 L728 590 Z" fill="#3fb950"/><rect x="722.0" y="540" width="156" height="34" rx="6" fill="#0d1117" opacity="1"/><text x="800.0" y="562" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12.5" fill="#3fb950" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">MEDIA</text><text x="800.0" y="610" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11" fill="#7d8590" font-weight="400" text-anchor="middle" opacity="1" letter-spacing="0">dedicated TLS TCP · drops freely</text><line x1="716" y1="726" x2="884" y2="726" stroke="#d29922" stroke-width="2.4" opacity="0.9" stroke-dasharray="3 6"/><path d="M872 720 L884 726 L872 732 Z" fill="#d29922"/><path d="M728 720 L716 726 L728 732 Z" fill="#d29922"/><rect x="722.0" y="682" width="156" height="34" rx="6" fill="#0d1117" opacity="1"/><text x="800.0" y="704" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12.5" fill="#d29922" font-weight="700" text-anchor="middle" opacity="1" letter-spacing="0">DISCOVERY</text><text x="800.0" y="752" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11" fill="#7d8590" font-weight="400" text-anchor="middle" opacity="1" letter-spacing="0">UDP multicast · best effort</text><rect x="56" y="872" width="1488" height="86" rx="10" fill="#11161d" opacity="1" stroke="#222b36" stroke-width="1"/><rect x="56" y="872" width="4" height="86" rx="2" fill="#f85149" opacity="1"/><text x="84" y="904" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#e6edf3" font-weight="600" text-anchor="start" opacity="1" letter-spacing="0">No line leaves this diagram.</text><text x="84" y="930" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12" fill="#7d8590" font-weight="400" text-anchor="start" opacity="1" letter-spacing="0">No cloud service, telemetry, crash reporter, licence check or update ping exists in the shipped product. Certificate validation compares the pinned thumbprint and nothing else — chain building would attempt a revocation lookup that times out rather than fails.</text><text x="1576" y="982" font-family="'Cascadia Mono',Consolas,'SF Mono',monospace" font-size="10.5" fill="#525c6b" font-weight="400" text-anchor="end" opacity="0.75" letter-spacing="1.1">ILLUSTRATIVE RECREATION · NO CLIENT DATA</text></svg>